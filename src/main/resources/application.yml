server:
  port: 8080
  address: 127.0.0.1

spring:
  application:
    name: prts-training-system

  # 从项目根目录的 .env 文件加载敏感配置（该文件已被 .gitignore 忽略，不会入库）
  config:
    import: optional:file:.env[.properties]

  datasource:
    url: jdbc:mysql://localhost:3306/prts_db?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=UTF-8&allowPublicKeyRetrieval=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: 86400000
  data:
    import-on-startup: true
    force-import: true
    csv-path: data/
